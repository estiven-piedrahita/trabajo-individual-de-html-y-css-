    <link rel="stylesheet" href="style.css">

<body>
    <header>
        <h1 class="titulo">CRUDSCOPE - Multimedia</h1>
        <nav>
            <div class="mani">
                <a href="index.html">HOME</a>
                <a href="crear.html">CREAR TAREAS</a>
                <a href="listado.html">LISTAR TAREAS</a>
                <a href="multimedia.html">MULTIMEDIA</a>
            </div>
        </nav>
    </header>

    <main>
        <section id="multimedia" class="seccion-multimedia">
            <h1>Galería de Multimedia</h1>

            <div class="multimedia-container">
                <div class="imagen-section">
                    <h2>Imagen 1</h2>
                    <img src="foto1.png" alt="Imagen 1 del sistema" width="400" height="300">
                </div>

                <div class="imagen-section">
                    <h2>Imagen 2</h2>
                    <img src="foto_1.webp" alt="Imagen 2 del sistema" width="400" height="300">
                </div>

                <div class="imagen-section">
                    <h2>Imagen 3</h2>
                    <img src="OIP (1).webp" alt="Imagen 3 del sistema" width="400" height="300">
                </div>

                <div class="imagen-section">
                    <h2>Imagen 4</h2>
                    <img src="OIP (2).webp" alt="Imagen 4 del sistema" width="400" height="300">
                </div>
            </div>


                <div class="video-section">
                    <h2>Video</h2>
                    <video controls poster="video-poster.jpg" width="400" height="300">
                        <source src="videoplayback.mp4" type="video/mp4">
                        Tu navegador no soporta la etiqueta de video.
                    </video>
                </div>
            </div>
        </section>
    </main>
